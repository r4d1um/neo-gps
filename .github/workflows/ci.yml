# Test, build all targets once and publish them as release v<VERSION>.
# A new release is only made when NEO_GPS_VERSION in src/neo_gps.h was raised
# (tags come from this workflow, not by hand). Build and release in one job:
# same artifacts, no double per-job minute rounding.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '!README.md', '!CHANGELOG.md', 'LICENSE', '.github/dependabot.yml', 'CLAUDE.md']
  pull_request:
    paths-ignore: ['**.md', '!README.md', '!CHANGELOG.md', 'LICENSE', '.github/dependabot.yml', 'CLAUDE.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PRs: cancel the old run; main: never cancel in the middle of a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # only for the release step
    steps:
      - uses: actions/checkout@v7   # Node 24

      # toolchains from r4d1um/setup: download once, then from the cache
      - uses: actions/cache@v6      # Node 24
        with:
          path: ~/.local/share/r4setup
          key: r4setup-${{ hashFiles('tools/session-setup.sh') }}

      - name: Toolchains
        run: tools/session-setup.sh

      - name: Host tests
        run: make test

      - name: Sanitizer
        run: mkdir -p build && gcc -std=c99 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc src/*.c tests/test_neo_gps.c -lm -o build/san && ./build/san

      - name: CMake
        run: cmake -S . -B cbuild && cmake --build cbuild && ctest --test-dir cbuild --output-on-failure

      - name: Build all targets, link test, packages
        run: make -j"$(nproc)" package DIST_STRICT=1

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(make -s print-version)
          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - version not raised, nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # the version's CHANGELOG section as release notes
          awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > build/notes.md
          gh release create "$tag" build/pkg/* --target "$GITHUB_SHA" --title "neo_gps $v" --notes-file build/notes.md
          echo "Release $tag published" >> "$GITHUB_STEP_SUMMARY"
