# Test, build all targets once and publish them as release v<VERSION>.
# A new release is only made when NEO_GPS_VERSION in src/neo_gps.h was raised
# (tags come from this workflow, not by hand). Build and release in one job:
# same artifacts, no double per-job minute rounding.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '!README.md', '!CHANGELOG.md', 'LICENSE', '.github/dependabot.yml', 'CLAUDE.md']
  pull_request:
    paths-ignore: ['**.md', '!README.md', '!CHANGELOG.md', 'LICENSE', '.github/dependabot.yml', 'CLAUDE.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PRs: cancel the old run; main: never cancel in the middle of a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # only for the release step
    steps:
      - uses: actions/checkout@v7   # Node 24

      # Cross toolchains from Ubuntu's own packages, cached between runs (composite action,
      # uses actions/cache v6 = Node 24). Bump "version" to force a fresh install.
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: >-
            gcc-avr avr-libc binutils-avr
            gcc-arm-none-eabi libnewlib-arm-none-eabi libnewlib-dev binutils-arm-none-eabi
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
            gcc-i686-linux-gnu libc6-dev-i386-cross
          # libnewlib-dev (newlib headers) is listed explicitly: as a mere dependency it was missing
          # after a cache restore (string.h not found on the Cortex-M targets).
          version: "2"

      - name: Toolchain versions
        run: |
          # fail early with a clear message if a restore left out headers
          test -f /usr/include/newlib/string.h && test -f /usr/lib/avr/include/string.h
          for c in gcc avr-gcc arm-none-eabi-gcc aarch64-linux-gnu-gcc arm-linux-gnueabihf-gcc i686-linux-gnu-gcc; do
            printf '%-26s %s\n' "$c" "$($c --version | head -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Host tests
        run: make test

      - name: Sanitizer
        run: mkdir -p build && gcc -std=c99 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc src/*.c tests/test_neo_gps.c -lm -o build/san && ./build/san

      - name: CMake
        run: cmake -S . -B cbuild && cmake --build cbuild && ctest --test-dir cbuild --output-on-failure

      - name: Build all targets, link test, packages
        run: make -j"$(nproc)" package DIST_STRICT=1

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(make -s print-version)
          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - version not raised, nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # the version's CHANGELOG section as release notes
          awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > build/notes.md
          gh release create "$tag" build/pkg/* --target "$GITHUB_SHA" --title "neo_gps $v" --notes-file build/notes.md
          echo "Release $tag published" >> "$GITHUB_STEP_SUMMARY"
